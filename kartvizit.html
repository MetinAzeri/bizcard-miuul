<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metin Azeri — Dijital Kartvizit</title>
<style>
  :root {
    --accent: #1d4ed8;
    --text-primary: #111827;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    padding: 36px 32px;
    text-align: center;
  }

  .avatar {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .name {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .title {
    margin: 6px 0 24px;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 0 20px;
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text-primary);
    transition: background 0.15s ease;
  }

  .contact-item:hover {
    background: var(--bg);
  }

  .icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    color: var(--accent);
  }

  .contact-text {
    font-size: 14px;
    text-align: left;
    overflow-wrap: anywhere;
  }

  @media (max-width: 420px) {
    .card {
      padding: 28px 20px;
    }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">MA</div>
    <h1 class="name">Metin Azeri</h1>
    <p class="title">Satış ve İş Geliştirme Direktörü</p>

    <hr class="divider">

    <div class="contact-list">
      <a class="contact-item" href="tel:+905353601808">

</body>
</html>
