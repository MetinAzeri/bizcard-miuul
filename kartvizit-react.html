<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metin Azeri — Dijital Kartvizit (React)</title>
<style>
  :root {
    --accent: #1d4ed8;
    --text-primary: #111827;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    padding: 36px 32px;
    text-align: center;
  }

  .avatar {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .name {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .title {
    margin: 6px 0 24px;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 0 20px;
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text-primary);
    transition: background 0.15s ease;
  }

  .contact-item:hover {
    background: var(--bg);
  }

  .icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    color: var(--accent);
  }

  .contact-text {
    font-size: 14px;
    text-align: left;
    overflow-wrap: anywhere;
  }

  @media (max-width: 420px) {
    .card {
      padding: 28px 20px;
    }
  }

  .qr-code {
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }

  .visitor-form {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .visitor-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
  }

  .visitor-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .visitor-button {
    padding: 10px 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .visitor-button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .visitor-button--secondary {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .visitor-button-row {
    display: flex;
    gap: 10px;
  }

  .visitor-button-row .visitor-button {
    flex: 1;
  }

  .visitor-message {
    margin: 0;
    font-size: 13px;
  }

  .visitor-message--success {
    color: #15803d;
  }

  .visitor-message--error {
    color: #b91c1c;
  }

  .save-contact-card {
    margin-top: 20px;
    padding: 20px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
  }

  .save-contact-title {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .save-contact-description {
    margin: 0 0 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .save-contact-hint {
    margin: 12px 0 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="vcard.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const WEBHOOK_URL = "YOUR_N8N_WEBHOOK_URL_HERE";

    function PhoneIcon() {
      return (
        <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
        </svg>
      );
    }

    function EmailIcon() {
      return (
        <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
          <polyline points="22,6 12,13 2,6" />
        </svg>
      );
    }

    function LinkedInIcon() {
      return (
        <svg className="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.114 20.452H3.558V9h3.556v11.452z" />
        </svg>
      );
    }

    function Avatar({ initials }) {
      return <div className="avatar">{initials}</div>;
    }

    function ContactList({ items }) {
      return (
        <div className="contact-list">
          {items.map((item) => (
            <a
              key={item.href}
              className="contact-item"
              href={item.href}
              target={item.external ? "_blank" : undefined}
              rel={item.external ? "noopener noreferrer" : undefined}
            >
              {item.icon}
              <span className="contact-text">{item.label}</span>
            </a>
          ))}
        </div>
      );
    }

    function getTodayLocalISODate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function VisitorForm({ card }) {
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [preferredDate, setPreferredDate] = useState("");
      const [dateError, setDateError] = useState(false);
      const [submittingAction, setSubmittingAction] = useState(null);
      const [feedback, setFeedback] = useState(null);

      const todayStr = getTodayLocalISODate();

      async function handleSubmit(event) {
        event.preventDefault();
        const action = event.nativeEvent.submitter.value;

        if (action === "meeting_request" && (!preferredDate || preferredDate < todayStr)) {
          setDateError(true);
          return;
        }
        setDateError(false);

        const payload = {
          action,
          visitor: { name: name.trim(), email: email.trim() },
          timestamp: new Date().toISOString(),
        };
        if (action === "save_card") {
          payload.card = card;
        } else {
          payload.preferredDate = new Date(preferredDate).toISOString();
        }

        setSubmittingAction(action);
        setFeedback(null);
        try {
          const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            throw new Error("Request failed");
          }
          setFeedback({
            type: "success",
            text:
              action === "save_card"
                ? "Kart bilgileriniz kaydedildi, teşekkürler!"
                : "Toplantı talebiniz alındı, teşekkürler!",
          });
        } catch (error) {
          setFeedback({ type: "error", text: "Bir hata oluştu, lütfen tekrar deneyin." });
        } finally {
          setSubmittingAction(null);
        }
      }

      return (
        <form className="visitor-form" onSubmit={handleSubmit}>
          <input
            type="text"
            className="visitor-input"
            placeholder="Ad Soyad"
            value={name}
            onChange={(event) => setName(event.target.value)}
            required
          />
          <input
            type="email"
            className="visitor-input"
            placeholder="E-posta"
            value={email}
            onChange={(event) => setEmail(event.target.value)}
            required
          />
          <input
            type="date"
            className="visitor-input"
            aria-label="Tercih edilen tarih"
            min={todayStr}
            value={preferredDate}
            onChange={(event) => {
              setPreferredDate(event.target.value);
              setDateError(false);
            }}
          />
          <div className="visitor-button-row">
            <button
              type="submit"
              name="action"
              value="save_card"
              className="visitor-button"
              disabled={submittingAction !== null}
            >
              {submittingAction === "save_card" ? "Gönderiliyor..." : "Kartı Kaydet"}
            </button>
            <button
              type="submit"
              name="action"
              value="meeting_request"
              className="visitor-button visitor-button--secondary"
              disabled={submittingAction !== null}
            >
              {submittingAction === "meeting_request" ? "Gönderiliyor..." : "Toplantı Talep Et"}
            </button>
          </div>
          {dateError && (
            <p className="visitor-message visitor-message--error">
              Toplantı talep etmek için geçmiş olmayan bir tarih seçmelisiniz.
            </p>
          )}
          {feedback && <p className={`visitor-message visitor-message--${feedback.type}`}>{feedback.text}</p>}
        </form>
      );
    }

    function SaveToContactsCard({ card }) {
      return (
        <div className="save-contact-card">
          <p className="save-contact-title">Kartviziti Telefonuma Ekle</p>
          <p className="save-contact-description">
            Kartvizitimi rehberine ekle. Yukarıdaki bilgilerini de doldurduysan, sana ayrıca ulaşabiliriz.
          </p>
          <button
            type="button"
            className="visitor-button"
            onClick={() => window.downloadVCard(card)}
          >
            Telefonuma Ekle
          </button>
          <p className="save-contact-hint">Ad, e-posta ve telefonunu da yazarsan sana ayrıca ulaşabiliriz.</p>
        </div>
      );
    }

    function ProfileCard({ name, title, initials, contacts, card }) {
      return (
        <div className="card">
          <Avatar initials={initials} />
          <h1 className="name">{name}</h1>
          <p className="title">{title}</p>
          <hr className="divider" />
          <ContactList items={contacts} />
          <VisitorForm card={card} />
          <SaveToContactsCard card={card} />
          <div id="qr-code" className="qr-code"></div>
        </div>
      );
    }

    const profile = {
      name: "Metin Azeri",
      title: "Satış ve İş Geliştirme Direktörü",
      initials: "MA",
      contacts: [
        { href: "tel:+905353601808", label: "0535 360 1808", icon: <PhoneIcon /> },
        { href: "mailto:azerimetin@gmail.com", label: "azerimetin@gmail.com", icon: <EmailIcon /> },
        {
          href: "https://www.linkedin.com/in/metinazeri/",
          label: "linkedin.com/in/metinazeri",
          icon: <LinkedInIcon />,
          external: true,
        },
      ],
    };

    const card = {
      name: profile.name,
      title: profile.title,
      phone: profile.contacts.find((item) => item.href.startsWith("tel:")).href.replace("tel:", ""),
      email: profile.contacts.find((item) => item.href.startsWith("mailto:")).href.replace("mailto:", ""),
      linkedin: profile.contacts.find((item) => item.href.includes("linkedin.com")).href,
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ProfileCard {...profile} card={card} />);
  </script>

  <script type="module">
    import React from "https://esm.sh/react@18";
    import { createRoot } from "https://esm.sh/react-dom@18/client";
    import { QRCodeSVG } from "https://esm.sh/qrcode.react@4.2.0?deps=react@18.3.1";

    const CARD_URL = "https://metinazeri.github.io/bizcard-miuul/kartvizit-react.html";

    function mountQrCode() {
      const container = document.getElementById("qr-code");
      if (!container) {
        // The #qr-code div is rendered by the Babel-transformed React tree,
        // which mounts asynchronously (React 18's scheduler does not commit
        // synchronously on DOMContentLoaded/load). Poll until it exists.
        requestAnimationFrame(mountQrCode);
        return;
      }
      createRoot(container).render(
        React.createElement(QRCodeSVG, { value: CARD_URL, size: 140 })
      );
    }

    mountQrCode();
  </script>

</body>
</html>
